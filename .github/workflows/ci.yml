name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trdng-build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AVALONIA_TELEMETRY_OPTOUT: "1"
      TRDNG_LIVE_TESTS: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require Docker memory envelope
        run: docker info >/dev/null
      - name: Restore, build, test and bounded replay without swap
        run: |
          mkdir -p "$RUNNER_TEMP/trdng-ci-cache"
          docker run --rm \
            --memory=2g --memory-swap=2g --pids-limit=512 --cpus=2 \
            --user "$(id -u):$(id -g)" \
            --env HOME=/ci-cache/home \
            --env DOTNET_CLI_HOME=/ci-cache/dotnet \
            --env NUGET_PACKAGES=/ci-cache/nuget \
            --env AVALONIA_TELEMETRY_OPTOUT=1 \
            --env TRDNG_LIVE_TESTS=0 \
            --tmpfs /tmp:rw,size=1g \
            --volume "$RUNNER_TEMP/trdng-ci-cache:/ci-cache" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            mcr.microsoft.com/dotnet/sdk:10.0.302@sha256:72dd743782f2ae7e5476fd64f6a460045e3998dc862218b80e6944cba79a01b0 \
            /bin/bash -lc '
              set -euo pipefail
              test -r /sys/fs/cgroup/memory.swap.max
              test "$(cat /sys/fs/cgroup/memory.swap.max)" = "0"
              dotnet restore Trdng.slnx
              dotnet build Trdng.slnx --configuration Release --no-restore
              timeout --signal=TERM --kill-after=15s 5m \
                dotnet test tests/Trdng.Core.Tests/Trdng.Core.Tests.csproj \
                  --configuration Release --no-build --no-restore \
                  --blame-hang-timeout 2m
              timeout --signal=TERM --kill-after=15s 2m \
                dotnet run --project tools/Trdng.MemorySoak/Trdng.MemorySoak.csproj \
                  --configuration Release --no-build --no-restore -- \
                  --cycles 1000000 --switch-every 1000 \
                  --sample-every 100000 --book-depth 256
            '
